<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
<!-- =================================================================
     SHINOBI LIFE SIMULATOR — UI icon set
     Original brush/ink glyphs on a 24x24 grid. Stroke-based and drawn
     with currentColor so every icon inherits the panel's text colour
     and stays crisp at any size. Injected once by assets.js; the game
     falls back to text glyphs if the sprite cannot be fetched.
     ================================================================= -->
<defs>
  <style>
    .s { fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .t { fill:none; stroke:currentColor; stroke-width:1.2; stroke-linecap:round; stroke-linejoin:round; opacity:.65; }
    .f { fill:currentColor; }
    .fq{ fill:currentColor; opacity:.45; }
  </style>
</defs>

<!-- ---------- gear / equipment ---------- -->
<symbol id="ico-headband" viewBox="0 0 24 24">
  <path class="s" d="M2 10h20"/><rect class="s" x="8.5" y="7.5" width="7" height="5" rx="1"/>
  <path class="t" d="M12 9.2a1.2 1.2 0 1 0 .01 0M4 10.5l-1.5 6M6.5 10.5l1 6"/>
</symbol>
<symbol id="ico-sword" viewBox="0 0 24 24">
  <path class="s" d="M20 3l-9.5 9.5M6 18l3-3M4.5 19.5l2.5-2.5"/>
